# Exporta el juego y lo publica como una VERSION NUEVA con cada push a main
# que cambie el juego: "Version 0.1", "Version 0.2"... cada una con su
# etiqueta (v0.1, v0.2...), sus archivos y lo que cambia desde la anterior.
# Asi cualquiera (el profesor, alguien sin el proyecto) se baja la ultima,
# para Windows (Vacio.exe), Linux (Vacio-linux.tar.gz), Mac (Vacio-mac.zip) o
# Android (Vacio-android.apk),
# sin tener Godot:
#
#     https://github.com/MatiasRodrigo0502/Vacio/releases/latest
#
# Usa los mismos scripts que el hook local (herramientas/), para que lo que
# hay en GitHub y lo de cada ordenador salga de la misma receta.
name: Publicar el juego

on:
  push:
    branches: [main]
    # Si solo cambian documentos, el juego es el mismo: no hay version nueva.
    paths-ignore:
      - "**.md"
  # Boton "Run workflow" en la pestana Actions, por si hay que rehacerlo a mano.
  workflow_dispatch:

# Si llegan varios push seguidos, solo cuenta el ultimo: el que estaba a
# medias se cancela, porque iba a publicar algo que ya no es lo ultimo. Como el
# numero se elige al publicar, no quedan huecos (0.3, 0.5...).
concurrency:
  group: publicar
  cancel-in-progress: true

# Escribir en el repositorio hace falta para crear la release y su etiqueta.
# El token lo pone GitHub para cada ejecucion; nadie lo maneja.
permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

# Tres trabajos: se exporta en Linux, se arranca la version de Mac en un Mac
# de verdad (GitHub los presta) y, si todo ha ido bien, se publica. Si el Mac
# falla, no sale ninguna version: mejor ninguna que una que no abre.
jobs:
  exportar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      anterior: ${{ steps.version.outputs.anterior }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      # Con toda la historia y las etiquetas: hacen falta para saber que numero
      # toca y que ha cambiado desde la version anterior.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # El numero que toca: la ultima v0.N, mas uno. Si este commit ya tiene
      # una (se ha relanzado a mano), se exporta con ese y no se publica otra.
      - name: Elegir el numero de version
        id: version
        run: |
          if propia="$(git describe --tags --exact-match --match 'v0.*' HEAD 2>/dev/null)"; then
            echo "version=${propia#v}" >> "$GITHUB_OUTPUT"
            echo "publicar=no" >> "$GITHUB_OUTPUT"
            echo "Este commit ya es la ${propia#v}: no se publica otra."
            exit 0
          fi
          ultima="$(git tag -l 'v0.*' | sed 's/^v0\.//' | sort -n | tail -1)"
          echo "version=0.$(( ${ultima:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "anterior=${ultima:+v0.$ultima}" >> "$GITHUB_OUTPUT"
          echo "publicar=si" >> "$GITHUB_OUTPUT"
          echo "Toca la 0.$(( ${ultima:-0} + 1 ))"

      # Godot para Linux (exporta a Windows igual que desde Windows). Va a la
      # carpeta temporal, no al proyecto: si no, Godot lo veria al escanear.
      - name: Bajar Godot
        run: |
          curl -sSfL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Instalar las plantillas de Windows, Linux y Mac
        run: python3 herramientas/instalar_plantillas.py --mac

      # Con el numero dentro: el menu del juego lo ensena.
      - name: Exportar
        env:
          VERSION_JUEGO: ${{ steps.version.outputs.version }}
          EXPORTAR_MAC: "1"
        run: bash herramientas/exportar.sh

      # Aqui nadie puede abrir build/exportar.log: si falla, se ensena.
      - name: Ensenar el registro si ha fallado
        if: failure()
        run: tail -n 80 build/exportar.log || true

      # Esta maquina es Linux: se puede arrancar la version de Linux de verdad
      # (sin ventana) y ver que el juego carga sin errores. La de Windows no se
      # puede abrir aqui; esa se prueba en los ordenadores del equipo.
      - name: Arrancar la version de Linux
        run: |
          timeout 60 build/Vacio.x86_64 --headless --quit-after 300 > "$RUNNER_TEMP/arranque.log" 2>&1 || true
          cat "$RUNNER_TEMP/arranque.log"
          grep -q "Godot Engine" "$RUNNER_TEMP/arranque.log" || { echo "No ha llegado a arrancar"; exit 1; }
          if grep -qE "SCRIPT ERROR|^ERROR" "$RUNNER_TEMP/arranque.log"; then
            echo "El juego arranca con errores"; exit 1
          fi

      # Un archivo suelto bajado con el navegador pierde el permiso de
      # ejecutarse, y Ubuntu no lo abre ("no se ha encontrado la aplicacion
      # predeterminada para application/x-executable"): paso con la 0.1.
      # Dentro de un .tar.gz el permiso viaja con el archivo, y al extraerlo
      # se abre con doble clic. Se comprueba que va dentro con el permiso.
      - name: Empaquetar la version de Linux
        run: |
          chmod +x build/Vacio.x86_64
          tar -czf build/Vacio-linux.tar.gz -C build Vacio.x86_64
          tar -tvzf build/Vacio-linux.tar.gz
          tar -tvzf build/Vacio-linux.tar.gz | grep -q '^-rwx' || { echo "Va sin permiso de ejecutarse"; exit 1; }

      # Los tres archivos pasan a los otros dos trabajos. Un dia basta: lo que
      # queda es la release.
      - name: Guardar lo exportado
        uses: actions/upload-artifact@v4
        with:
          name: juego
          path: |
            build/Vacio.exe
            build/Vacio-linux.tar.gz
            build/Vacio-mac.zip
          retention-days: 1
          if-no-files-found: error

  # El .zip de Mac lleva Vacio.app con una firma ad-hoc (la gratuita): sin
  # firma, los Mac con chip de Apple no lo abren. Aqui se comprueba que esta
  # firmada, que trae los dos procesadores (Apple e Intel) y que el juego
  # arranca sin errores, como la version de Linux.
  probar-mac:
    needs: exportar
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: juego

      - name: Arrancar la version de Mac
        run: |
          ditto -x -k Vacio-mac.zip mac
          app="$(find mac -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app" || { echo "El .zip no trae ningun .app"; unzip -l Vacio-mac.zip | head -20; exit 1; }
          binario="$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)"
          echo "App: $app  Programa: $binario"
          codesign -dv --verbose=2 "$app" 2>&1 | tee firma.txt
          grep -q "Signature=adhoc" firma.txt || { echo "Va sin la firma ad-hoc"; exit 1; }
          codesign --verify --deep --strict "$app"
          lipo -archs "$binario" | tee arquitecturas.txt
          grep -q arm64 arquitecturas.txt && grep -q x86_64 arquitecturas.txt || { echo "Le falta un procesador"; exit 1; }
          "$binario" --headless --quit-after 300 > arranque.log 2>&1 || true
          cat arranque.log
          grep -q "Godot Engine" arranque.log || { echo "No ha llegado a arrancar"; exit 1; }
          if grep -qE "SCRIPT ERROR|^ERROR" arranque.log; then
            echo "El juego arranca con errores"; exit 1
          fi

  # El .apk de Android (desde la 0.54, pedido por Matias el 2026-11-03). Esta
  # maquina ya trae el SDK de Android; Java 17 se pone aqui. Va aparte y no
  # para la version si falla: mejor publicar Windows, Linux y Mac sin el .apk
  # que nada. No se puede arrancar aqui (haria falta un movil o un emulador):
  # se comprueba que va firmado y con su numero.
  android:
    needs: exportar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bajar Godot
        run: |
          curl -sSfL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Instalar las plantillas de Android
        run: python3 herramientas/instalar_plantillas.py --android

      # La clave para firmarlo, de los secretos del repositorio (Settings →
      # Secrets and variables → Actions). Sin ellos, el script firma con una
      # clave nueva cada vez (ver exportar_android.sh).
      - name: Exportar para Android
        env:
          VERSION_JUEGO: ${{ needs.exportar.outputs.version }}
          ANDROID_CLAVE_BASE64: ${{ secrets.ANDROID_CLAVE_BASE64 }}
          ANDROID_CLAVE_ALIAS: ${{ secrets.ANDROID_CLAVE_ALIAS }}
          ANDROID_CLAVE_CONTRASENA: ${{ secrets.ANDROID_CLAVE_CONTRASENA }}
        run: bash herramientas/exportar_android.sh

      - name: Guardar el .apk
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/Vacio-android.apk
          retention-days: 1
          if-no-files-found: error

  # La version para el navegador, en GitHub Pages (desde la 0.62, pedido por Matias
  # el 2026-11-06): https://matiasrodrigo0502.github.io/Vacio/. Va por su cuenta,
  # como el .apk: ni para la version si falla, ni espera a que haya un Mac libre.
  # No se puede arrancar aqui (haria falta un navegador con graficos).
  web:
    needs: exportar
    runs-on: ubuntu-latest
    # Subir a Pages pide estos permisos, solo aqui. El token lo pone GitHub.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Bajar Godot
        run: |
          curl -sSfL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Instalar la plantilla del navegador
        run: python3 herramientas/instalar_plantillas.py --web

      - name: Exportar para el navegador
        env:
          VERSION_JUEGO: ${{ needs.exportar.outputs.version }}
        run: bash herramientas/exportar_web.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Publicar en GitHub Pages
        id: desplegar
        uses: actions/deploy-pages@v4

  publicar:
    needs: [exportar, probar-mac, android]
    # Aunque falle el de Android: los otros tres se publican igual.
    if: >-
      always() && needs.exportar.result == 'success' && needs.probar-mac.result == 'success'
      && needs.exportar.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    steps:
      # Con la historia: las notas dicen que ha cambiado desde la anterior.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: juego
          path: build

      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: android
          path: build

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.exportar.outputs.version }}
          ANTERIOR: ${{ needs.exportar.outputs.anterior }}
        run: |
          fecha="$(TZ=Europe/Madrid date '+%d/%m/%Y')"
          {
            echo "**Vacío, versión $VERSION** ($fecha)."
            echo
            echo "**Para jugar** no hace falta instalar nada ni tener Godot:"
            echo
            echo "- **Windows:** descarga \`Vacio.exe\` y ábrelo. Puede avisar de que es de un editor desconocido, porque no está firmado: *Más información → Ejecutar de todas formas*."
            echo "- **Linux:** descarga \`Vacio-linux.tar.gz\`, extráelo (clic derecho → *Extraer aquí*) y abre \`Vacio.x86_64\` con doble clic."
            echo "- **Mac:** descarga \`Vacio-mac.zip\`, ábrelo y abre \`Vacio.app\` (si quieres, arrástrala antes a *Aplicaciones*). La primera vez macOS avisa de que no puede comprobar si es segura, porque no está verificada por Apple: ve a *Ajustes del Sistema → Privacidad y seguridad* y pulsa *Abrir igualmente*. Solo hace falta una vez."
            if [ -f build/Vacio-android.apk ]; then
              echo "- **Android:** descarga \`Vacio-android.apk\` desde el móvil y ábrelo. La primera vez Android pide permiso para instalar apps de esa fuente (el navegador): dáselo. Si al actualizar dice que no se puede instalar, desinstala antes la versión que tienes."
            fi
            echo "- **Desde el navegador, sin instalar nada** (móvil u ordenador): abre <https://matiasrodrigo0502.github.io/Vacio/>. Solo para un jugador, y lo que ganas se guarda en ese navegador."
            echo
            echo "Desde la 0.18, el juego avisa al abrirlo si hay una versión más nueva y, en Windows, se actualiza con un botón."
            echo
            # OJO: el juego lee esta lista (un "- " por linea, debajo del
            # primer "### ") para ensenar en su aviso lo que trae la version
            # nueva (scripts/actualizacion.gd, _cambios). Si cambia su forma,
            # hay que cambiarlo alli tambien.
            if [ -n "$ANTERIOR" ]; then
              echo "### Qué cambia desde la ${ANTERIOR#v}"
              echo
              git log --no-merges --format='- %s' "$ANTERIOR..HEAD"
            else
              echo "Es la primera versión con número: incluye todo lo hecho hasta ahora ([resumen](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/todo-lo-hecho.md))."
            fi
          } > "$RUNNER_TEMP/notas.md"
          # La mas nueva queda como "latest": el enlace de descarga de siempre
          # (releases/latest/download/Vacio.exe) lleva a ella.
          archivos=(build/Vacio.exe build/Vacio-linux.tar.gz build/Vacio-mac.zip)
          [ -f build/Vacio-android.apk ] && archivos+=(build/Vacio-android.apk)
          gh release create "v$VERSION" "${archivos[@]}" --target "$GITHUB_SHA" \
            --title "Versión $VERSION" --notes-file "$RUNNER_TEMP/notas.md" --latest
